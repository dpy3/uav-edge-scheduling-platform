name: Scheduler service

on:
  push:
    paths:
      - "scheduler-service/**"
      - ".github/workflows/scheduler-service.yml"
  pull_request:
    paths:
      - "scheduler-service/**"
      - ".github/workflows/scheduler-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run experiment smoke test
        run: python run_extended_experiments.py --seeds 2 --budget 0.05

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build scheduler image
        run: docker build -t uav-edge-scheduler-ci ./scheduler-service
